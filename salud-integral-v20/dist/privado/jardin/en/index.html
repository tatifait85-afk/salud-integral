<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Digestive Garden | Salud Integral</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#F7F3E8">
<base href="/assets/jardin/">
<script>window.SITE_HOME={"es":"/","en":"/en/"};</script>
<style>
/* Concepto: juego de aventura casual sobre las ilustraciones de Salud Integral.
   Mapa -> escena -> acción con las manos -> semillas -> vuelta al mapa. Marco quieto, la ilustración protagoniza. */
@font-face{font-family:'Fraunces';font-style:normal;font-weight:100 900;font-display:swap;src:url(fonts/fraunces-latin-wght-normal.woff2) format('woff2')}
@font-face{font-family:'Fraunces';font-style:italic;font-weight:100 900;font-display:swap;src:url(fonts/fraunces-latin-wght-italic.woff2) format('woff2')}
@font-face{font-family:'Jost';font-style:normal;font-weight:100 900;font-display:swap;src:url(fonts/jost-latin-wght-normal.woff2) format('woff2')}
:root{
  --ivory:#F7F3E8; --cream:#FBF8F1; --forest:#173A1E; --olive:#5F7318; --olive-d:#4B5C12;
  --sage:#A8C08A; --mint:#DCE8D2; --sand:#D7C7A5; --wood:#8B6B4A; --terra:#D98B67; --terra-d:#A9552F;
  --ink:#3A2C22; --ink-soft:#5A4A3E; --line:rgba(23,58,30,.16); --white:#FFFFFF;
  --serif:'Fraunces','Iowan Old Style',Georgia,serif; --sans:'Jost','Segoe UI',system-ui,-apple-system,sans-serif;
  --gut-l:max(16px,env(safe-area-inset-left,0px)); --gut-r:max(16px,env(safe-area-inset-right,0px));
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ivory);color:var(--ink);font-family:var(--sans);font-size:1.0625rem;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
img,svg{display:block}
:focus-visible{outline:3px solid var(--terra-d);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--serif);color:var(--forest);font-weight:400;line-height:1.12;margin:0;text-wrap:balance}
#app{height:100%;display:flex;flex-direction:column;background:var(--ivory)}

/* ---------- Barra superior ---------- */
.topbar{flex:none;display:flex;align-items:center;gap:10px;min-height:56px;padding:6px var(--gut-r) 6px var(--gut-l);background:var(--cream);border-bottom:1px solid var(--line)}
.brand{font-family:var(--serif);font-size:1.15rem;color:var(--forest);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.pill{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:999px;border:1.5px solid var(--forest);background:transparent;color:var(--forest);font-weight:600;font-size:.92rem}
.pill{white-space:nowrap}
.pill.seeds{margin-left:auto;border-color:var(--terra-d);color:var(--terra-d);font-variant-numeric:tabular-nums;cursor:default}
.pill.back{border-color:var(--olive);background:var(--olive);color:#fff}
.pill:hover:not(.seeds){background:var(--forest);color:var(--ivory)} .pill.back:hover{background:var(--olive-d)}
.pill.gard{padding:0 12px}
.pill.reset.ask{background:var(--terra-d);border-color:var(--terra-d);color:#fff}

/* ---------- Escenario y dock ---------- */
.stage{flex:1;min-height:0;position:relative;overflow:auto;overscroll-behavior:contain}
.dock{flex:none;background:var(--cream);border-top:1px solid var(--line);padding:10px var(--gut-r) calc(10px + env(safe-area-inset-bottom,0px)) var(--gut-l);display:grid;gap:10px}
.guide{display:flex;align-items:flex-end;gap:10px;max-width:980px;width:100%;margin:0 auto}
.guide .brote{width:56px;height:56px;flex:none;border-radius:50%;object-fit:cover;background:var(--mint)}
.bubble{position:relative;flex:1;min-width:0;background:var(--white);border:1.5px solid var(--line);border-radius:18px 18px 18px 6px;padding:10px 14px;font-size:1.02rem;color:var(--ink)}
.bubble.shake{animation:shake .45s}
.actions{display:flex;flex-wrap:wrap;gap:10px;max-width:980px;width:100%;margin:0 auto}
.btn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:0 22px;border-radius:999px;border:2px solid transparent;font-weight:600;font-size:1.08rem;text-align:center;line-height:1.15}
.btn.primary{background:var(--olive);color:#fff} .btn.primary:hover{background:var(--olive-d)}
.btn.terra{background:var(--terra-d);color:#fff}
.btn.ghost{flex:none;background:transparent;border-color:var(--forest);color:var(--forest)} .btn.ghost:hover{background:var(--forest);color:var(--ivory)}
.btn:active{transform:translateY(1px)}

/* ---------- Bienvenida ---------- */
.welcome{position:relative;height:100%;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 40%,var(--mint),var(--ivory) 70%)}
.cover{position:relative;height:100%;aspect-ratio:2/3;max-width:100%;overflow:hidden;box-shadow:0 20px 60px -24px rgba(23,58,30,.5);container-type:inline-size}
.cover img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cover .ttl{position:absolute;left:10%;right:10%;top:6%;text-align:center;padding:5cqw 3cqw 6cqw;border-radius:50%;background:radial-gradient(ellipse at center,rgba(251,248,241,.82) 0%,rgba(251,248,241,.55) 55%,rgba(251,248,241,0) 78%)}
.cover .eyebrow{font-size:3.2cqw;letter-spacing:.22em;text-transform:uppercase;color:var(--forest);font-weight:600;margin-bottom:.5em}
.cover h1{font-size:13.5cqw;letter-spacing:-.02em;line-height:1}
.cover h1 span{display:block}
.cover h1 em{display:block;font-style:italic;color:var(--terra-d);font-size:.6em;margin-bottom:.05em}
.cover .sub{font-family:var(--serif);font-style:italic;color:var(--forest);margin:.8em auto 0;font-size:4.6cqw;max-width:88%;line-height:1.25}
.cover .go{position:absolute;left:50%;transform:translateX(-50%);bottom:8%;width:min(78%,340px);box-shadow:0 12px 30px -10px rgba(23,58,30,.6)}
.langfloat{position:absolute;top:10px;right:var(--gut-r);z-index:3}

/* ---------- Personaje ---------- */
.char{max-width:560px;margin:0 auto;padding:16px var(--gut-r) 18px var(--gut-l);display:grid;gap:16px}
.char h2{font-size:1.9rem;text-align:center}
.preview{justify-self:center;width:150px;height:200px;border-radius:50% 50% 24px 24px/40% 40% 24px 24px;background:var(--mint);display:grid;place-items:end center;padding-bottom:10px;overflow:hidden;border:2px solid var(--sage)}
.preview svg{height:92%}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg button{min-height:52px;border-radius:14px;border:2px solid var(--line);background:var(--white);font-weight:600;color:var(--forest);font-size:1.05rem}
.seg button[aria-pressed="true"]{border-color:var(--olive);background:var(--mint);box-shadow:inset 0 0 0 1px var(--olive)}
.field label,.lbl{display:block;font-size:.85rem;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--ink-soft);margin-bottom:8px}
.sw{display:flex;gap:12px;flex-wrap:wrap}
.sw button{width:48px;height:48px;border-radius:50%;border:3px solid var(--white);box-shadow:0 0 0 1.5px var(--line)}
.sw button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--olive)}
.field input{width:100%;min-height:52px;border-radius:14px;border:2px solid var(--line);background:var(--white);padding:0 14px;font:inherit;font-size:1.1rem;color:var(--ink)}
.field input:focus{outline:3px solid var(--terra-d);outline-offset:1px;border-color:var(--olive)}

/* ---------- Mapa ---------- */
.mapstage{background:linear-gradient(180deg,var(--mint),var(--sand))}
.mapscroll{height:100%;display:flex;overflow-x:auto;overflow-y:hidden;scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
.map{position:relative;flex:none;height:100%;aspect-ratio:3/2;margin-inline:auto;user-select:none}
.map img{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.map .base{filter:grayscale(.85) brightness(1.04) contrast(.92)}
.map .color{transition:-webkit-mask-image .6s,mask-image .6s}
.zone{position:absolute;border:0;background:transparent;border-radius:28px;padding:0}
.zone:hover{background:rgba(255,255,255,.1)}
.zone.locked{cursor:not-allowed}
.badge{position:absolute;z-index:4;width:clamp(30px,4.2%,46px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;transform:translate(-50%,-50%);pointer-events:none;box-shadow:0 4px 10px -3px rgba(0,0,0,.45);font-weight:700}
.badge svg{width:62%;height:62%}
.badge.done{background:var(--olive);color:#fff;border:2px solid #fff}
.badge.lock{background:var(--forest);color:var(--ivory);border:2px solid var(--sand)}
.badge.skip{background:var(--sand);color:var(--forest);border:2px dashed var(--wood)}
.tapchip{position:absolute;z-index:6;transform:translate(-50%,-50%);pointer-events:none;background:var(--terra-d);color:#fff;font-weight:700;padding:8px 16px;border-radius:999px;font-size:1rem;white-space:nowrap;box-shadow:0 8px 20px -6px rgba(0,0,0,.5);animation:bob 1.3s ease-in-out infinite}
.walker{position:absolute;z-index:7;width:6.2%;transform:translate(-50%,-100%);transition:left .95s ease-in-out,top .95s ease-in-out;pointer-events:none;filter:drop-shadow(0 6px 5px rgba(40,25,10,.4))}
.walker svg{width:100%;height:auto}
.steps{display:flex;align-items:center;justify-content:center;gap:0;max-width:980px;margin:0 auto;width:100%}
.steps .st{flex:none;width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--white);font-weight:700;color:var(--ink-soft);display:grid;place-items:center;font-size:1rem}
.steps .st.done{background:var(--olive);border-color:var(--olive);color:#fff}
.steps .st.next{border-color:var(--terra-d);color:var(--terra-d);box-shadow:0 0 0 4px rgba(217,139,103,.28)}
.steps .st.skip{border-style:dashed}
.steps .st svg{width:55%}
.steps .ln{flex:1;height:3px;background:var(--line);max-width:70px}
.steps .ln.on{background:var(--olive)}

/* ---------- Estación 1: pizarra ---------- */
.scene{max-width:1080px;margin:0 auto;padding:12px var(--gut-r) 18px var(--gut-l);display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.scene h2{font-size:clamp(1.5rem,4.6vw,2.1rem)}
.scene .kick{font-size:.8rem;letter-spacing:.16em;text-transform:uppercase;font-weight:600;color:var(--terra-d);margin-bottom:4px}
.boardwrap{position:relative}
.board{position:relative;border-radius:14px;overflow:hidden;box-shadow:0 14px 34px -18px rgba(23,58,30,.55);container-type:inline-size}
.board img.bd{width:100%;height:auto}
/* Un solo día: cada fila de la pizarra es un hábito (icono + nombre + respuesta en tiza) */
.grid{position:absolute;left:13.93%;top:15.14%;width:72.2%;height:63.48%;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:112fr 108fr 106fr 102fr 102fr 120fr}
.brow{display:flex;align-items:stretch;min-width:0;min-height:0;padding:0;border:0;background:transparent;text-align:left;color:#EFE9D6}
.bic{flex:0 0 14.04%;display:grid;place-items:center;padding:3px;min-width:0;min-height:0}
.bic img{max-width:100%;max-height:100%;width:auto;height:100%;object-fit:contain;border-radius:6px;opacity:.38;filter:grayscale(.75);background:#fff}
.brow.on .bic img{opacity:1;filter:none;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.4);animation:pop .4s cubic-bezier(.2,1.6,.4,1)}
.btx{flex:1;min-width:0;display:flex;align-items:center;justify-content:space-between;gap:2cqw;margin:3px 0 3px 2px;padding:0 2.4cqw;border-radius:5px;background:rgba(36,58,48,.93);box-shadow:inset 0 0 0 1px rgba(239,233,214,.22)}
.brow:hover .btx{box-shadow:inset 0 0 0 1.5px rgba(246,231,166,.8)}
.bnm{font-family:var(--serif);font-size:clamp(11px,3.1cqw,21px);line-height:1.1;opacity:.92}
.bans{font-size:clamp(10.5px,2.9cqw,19px);line-height:1.1;font-style:italic;opacity:.6;text-align:right}
.brow.on .bans{font-style:normal;font-weight:600;color:#F6E7A6;opacity:1}
.tray{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tcard{position:relative;border:2px solid var(--line);background:var(--white);border-radius:18px;padding:6px 6px 8px;display:grid;gap:4px;text-align:center;font-weight:600;font-size:.98rem;color:var(--forest);transition:transform .15s,box-shadow .15s}
.tcard:hover{transform:translateY(-2px);box-shadow:0 10px 22px -12px rgba(23,58,30,.5)}
.tcard .ph{aspect-ratio:1.15;display:grid;place-items:center}
.tcard img{width:auto;max-width:92%;height:94%;object-fit:contain}
.tcard[aria-pressed="true"]{border-color:var(--olive);background:var(--mint);box-shadow:0 0 0 2px var(--olive)}
.tcard .ck{position:absolute;top:-8px;right:-8px;width:30px;height:30px;border-radius:50%;background:var(--olive);color:#fff;display:none;place-items:center;border:2px solid #fff}
.tcard .ck svg{width:60%}
.tcard[aria-pressed="true"] .ck{display:grid}
.qhead{font-family:var(--serif);font-size:1.3rem;color:var(--forest)}
@media (min-width:700px){
  .scene.two{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);align-items:start}
  .scene.two .full{grid-column:1/-1}
  .scene.two .boardwrap{grid-column:1;grid-row:2}
  .scene.two .trayblock{grid-column:2;grid-row:2}
  /* Estación 1: fila de tarjetas arriba; pizarra y explicación lado a lado */
  .scene.s1{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);align-items:stretch}
  .scene.s1 .full{grid-column:1/-1}
  .scene.s1 .trayblock{grid-column:1/-1;grid-row:2}
  .scene.s1 .tray{grid-template-columns:repeat(6,minmax(0,1fr))}
  .scene.s1 .boardwrap{grid-column:1;grid-row:3}
  .scene.s1 .notewrap{grid-column:2;grid-row:3;display:flex}
  .scene.s1 .notewrap .habnote{flex:1;grid-template-columns:132px minmax(0,1fr);padding:18px;gap:6px 18px;align-content:center}
  .scene.s1 .notewrap .habnote img{width:132px;height:132px}
  .scene.s1 .notewrap .habnote h3{font-size:1.5rem}
  .scene.s1 .notewrap .habnote p{font-size:1.12rem}
  .scene.s1 .notewrap .habnote.empty{display:grid;place-items:center;text-align:center}
}

/* Estación 2: catálogo amplio. Plato y alimentos en zonas separadas, nunca superpuestas */
@media (min-width:700px){.scene.s2 .boardwrap{position:sticky;top:8px;align-self:start}.scene.s2 .tray{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:699px){
  .scene.s2{height:100%;padding-bottom:8px;grid-template-rows:auto auto minmax(0,1fr);gap:8px}
  .scene.s2 .lead{display:none}
  .scene.s2 h2{font-size:1.35rem}
  .scene.s2 .boardwrap .pic{width:min(100%,calc(27vh*1.333));margin:0 auto}
  .scene.s2 .trayblock{overflow-y:auto;min-height:0;padding:6px 6px 8px;margin:0 -6px;-webkit-overflow-scrolling:touch}
  .scene.s2 .tray{gap:8px 6px}
  .scene.s2 .tcard{font-size:.8rem;padding:4px 4px 6px;border-radius:14px;line-height:1.1}
  .scene.s2 .tcard .ph{aspect-ratio:1.6}
}

/* Estación 3: la explicación aparece junto al círculo seleccionado */
.pw{position:relative}
.pw>img.bgi{width:100%;height:auto;display:block}
.stepco{position:absolute;z-index:3;width:min(40%,360px);background:var(--cream);border:2px solid var(--olive);border-radius:16px;padding:10px 14px 12px;box-shadow:0 14px 30px -12px rgba(23,58,30,.7);display:grid;gap:4px;animation:pop2 .25s ease-out}
.stepco .cok{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--terra-d)}
.stepco b{font-family:var(--serif);font-weight:500;font-size:1.15rem;color:var(--forest);line-height:1.15}
.stepco p{margin:0;font-size:1rem;line-height:1.35;color:var(--ink)}
.stepco .dots2{justify-content:flex-start;margin-top:4px}
.stepco.r::before,.stepco.l::before{content:"";position:absolute;top:22px;width:14px;height:14px;background:var(--cream);transform:rotate(45deg)}
.stepco.r::before{left:-9px;border-left:2px solid var(--olive);border-bottom:2px solid var(--olive)}
.stepco.l::before{right:-9px;border-right:2px solid var(--olive);border-top:2px solid var(--olive)}
@keyframes pop2{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
@container (max-width:640px){
  .stepco{position:static;width:auto;border-radius:0;border:0;border-top:2px solid var(--olive);box-shadow:none;padding:10px 14px 12px;animation:none}
  .stepco::before{display:none}
}
.scene.s3 .pic{justify-self:center;width:min(100%,calc((100dvh - 330px)*1.5));min-width:min(100%,340px)}
@media (min-width:900px){.scene.s3 .pic{width:min(100%,calc((100dvh - 270px)*1.5))}}
.scene.s3 .howto{padding:8px 14px}
@media (max-width:699px) and (max-height:720px){.scene.s3 .howto{display:none}.scene.s3{gap:8px;padding-top:6px}.stepco p{font-size:.95rem}}

.isteps{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.istep{display:flex;gap:14px;align-items:center;background:var(--white);border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;font-size:1.1rem}
.inum{flex:none;width:36px;height:36px;border-radius:50%;background:var(--terra-d);color:#fff;display:grid;place-items:center;font-weight:700;font-variant-numeric:tabular-nums}
.tcard .ans{font-size:.82rem;font-weight:500;color:var(--ink-soft);line-height:1.15;min-height:1.15em}
.tcard .ans.on{color:var(--olive-d);font-weight:700}
.cv{position:absolute;right:1px;bottom:1px;font-size:.58rem;line-height:1;background:var(--forest);color:#fff;border-radius:6px;padding:2px 4px;font-weight:700;pointer-events:none}
.cell{position:relative}
.sheetbg{position:fixed;inset:0;z-index:30;background:rgba(23,58,30,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:min(560px,100%);background:var(--cream);border-radius:24px 24px 0 0;padding:18px var(--gut-r) calc(18px + env(safe-area-inset-bottom,0px)) var(--gut-l);display:grid;gap:14px;box-shadow:0 -20px 50px -20px rgba(0,0,0,.5);animation:up .25s ease-out}
@media (min-width:700px){.sheetbg{align-items:center}.sheet{border-radius:24px}}
.sh-top{display:flex;gap:14px;align-items:center}
.sh-top img{width:84px;height:84px;object-fit:contain;background:#fff;border-radius:16px;flex:none}
.sh-q{font-family:var(--serif);font-size:1.45rem;color:var(--forest);line-height:1.15}
.sh-x{margin:0;font-size:1rem;line-height:1.35;color:var(--ink)}
.sheet{max-height:94vh;max-height:94dvh;overflow:auto}
.opts{display:grid;gap:10px}
.opt{min-height:56px;border-radius:16px;border:2px solid var(--line);background:#fff;font-weight:600;font-size:1.1rem;color:var(--forest);text-align:center;padding:0 14px}
.opt:hover{border-color:var(--olive)} .opt.sel{background:var(--mint);border-color:var(--olive);box-shadow:inset 0 0 0 1px var(--olive)}
.sh-skip{flex:none;width:100%;min-height:46px;font-size:.98rem}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.pgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.phead{margin-bottom:4px;grid-template-columns:repeat(7,minmax(0,1fr));font-size:.8rem;font-weight:700;color:var(--ink-soft);text-align:center}
.phead span:first-child{display:none}
.prow2{padding:8px 0;border-top:1px solid var(--line);display:grid;gap:6px}
.pname{display:flex;gap:8px;align-items:center;font-weight:600;color:var(--forest)}
.pname img{width:34px;height:34px;object-fit:contain;border-radius:8px;background:#fff}
.pc{display:grid;place-items:center;min-height:34px;border-radius:10px;background:var(--cream);border:1px solid var(--line);font-size:.8rem;font-weight:700;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.pc.on{background:var(--mint);border-color:var(--sage);color:var(--forest)}
.pc.warn{background:#FBEDE4;border-color:var(--terra);color:var(--terra-d)}
/* ---------- Patrones ---------- */
.card{background:var(--white);border:1.5px solid var(--line);border-radius:20px;padding:14px}
.prow{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:6px 10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.prow img{width:44px;height:44px;object-fit:contain;border-radius:8px;background:#fff}
.prow .nm{font-weight:600;color:var(--forest)}
.prow .ct{font-size:.9rem;color:var(--ink-soft);font-variant-numeric:tabular-nums;white-space:nowrap}
.dots{display:flex;gap:5px;margin-top:4px}

  const ms=document.getElementById('ms'),mp=document.getElementById('mp');if(!ms||!mp)return;
  const z=ZONES[n-1],cx=(z.mask[0]/100)*mp.offsetWidth,target=Math.max(0,cx-ms.clientWidth/2);
  if(instant){ms.style.scrollBehavior='auto';ms.scrollLeft=target;ms.style.scrollBehavior=''}else ms.scrollTo({left:target,behavior:reduce?'auto':'smooth'});
}
function go(screen){S.screen=screen;S.note=null;S.askReset=false;render()}
function walkTo(n){
  S.at=n;
  if(n===1){S.st1.phase='board';S.st1.q=null;go('st1')}
  else{if(ENTER[n])ENTER[n]();go('st'+n)}
}
function resetAll(){
  S.screen='map';S.p={name:''};S.seeds=0;S.done={};S.cautious=false;S.at=null;S.note=null;S.askReset=false;
  S.st1={phase:'board',cells:{},alarms:{},last:null,q:null,focus:null};S.rew=1;S.sel=null;RESET.forEach(f=>f());render();
}
/* ====== Eventos ====== */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,tt=t();
  /* Un doble toque en un botón que queda en el mismo lugar de la pantalla siguiente activaba también ese botón y saltaba una pantalla. */
  if((b.closest('.actions')||a==='zone'||a==='step'||a==='toMap'||a==='back'||a==='final')&&Date.now()-(S.t0||0)<450)return;
  switch(a){
    case 'lang':S.lang=S.lang==='es'?'en':'es';render(true);break;
    case 'reset':if(S.askReset){resetAll()}else{S.askReset=true;render(true);setTimeout(()=>{if(S.askReset){S.askReset=false;render(true)}},3500)}break;
    case 'back':goBack();break;
    case 'toMap':S.st1.phase=S.st1.phase==='reward'?'board':S.st1.phase;go('map');break;
    case 'zone':case 'step':{
      const n=+b.dataset.n,s=zstate(n);
      if(s==='locked'){S.note=tt.locked(nextStation());S.shake=true;render(true);return}
      if(s==='skip'){S.note=tt.skipped;S.shake=true;render(true);return}
      if(s==='done'&&n===1){walkTo(1);return}
      if(s==='done'){walkTo(n);return}
      walkTo(n);break}
    case 'sdown':{const bw=document.querySelector('.boardwrap');if(bw)bw.scrollIntoView({behavior:reduce?'auto':'smooth',block:'end'});break}
    case 'toPatterns':S.st1.phase='patterns';render();break;
    case 'backBoard':S.st1.phase='board';render();break;
    case 'place':S.st1.q=+b.dataset.r;S.st1.focus=S.st1.q;S.st1.last=null;render(true);break;
    case 'opt':{const k=S.st1.q;S.st1.cells[k]=+b.dataset.i;S.st1.last=k;S.st1.focus=k;S.st1.q=null;render(true);break}
    case 'clearq':{const k=S.st1.q;delete S.st1.cells[k];S.st1.last=null;S.st1.q=null;render(true);break}
    case 'closeq':if(e.target===b){S.st1.q=null;render(true)}break;
    case 'toAlarms':S.st1.phase='alarms';render();break;
    case 'alarm':{const id=b.dataset.id;if(S.st1.alarms[id])delete S.st1.alarms[id];else S.st1.alarms[id]=1;render(true);break}
    case 'alarmsDone':if(Object.keys(S.st1.alarms).length){S.cautious=true;S.st1.phase='care'}else{S.cautious=false;S.st1.phase='reward'}render();break;
    case 'claim':S.st1.phase='reward';render();finish1();break;
    default:if(ACT[a])ACT[a](b,e);
  }
  if(a==='alarmsDone'&&S.st1.phase==='reward')finish1();
});
/* Atrás un paso: vuelve a la pantalla anterior de la estación; desde la primera pantalla vuelve al jardín. */
function goBack(){
  const sc=S.screen;S.sel=null;S.note=null;
  if(sc==='final'){S.st5.phase='plan';go('st5');return}
  if(sc==='st1'){const s=S.st1;
    if(s.q!==null){s.q=null;render(true);return}
    const prev={patterns:'board',alarms:'patterns',care:'alarms'}[s.phase];
    if(prev){s.phase=prev;render();return}}
  else if(sc==='st2'){if(S.st2.phase==='result'){S.st2.phase='build';render();return}}
  else if(sc==='st3'){const s=S.st3,last=s.pick?FERM[s.pick].steps.length-1:0;
    if(s.phase==='steps'){if(s.step>0){s.step--;render(true)}else{s.phase='pick';render()}return}
    if(s.phase==='temp'){s.phase='steps';s.step=last;render();return}
    if(s.phase==='check'){if(s.pick==='chucrut')s.phase='temp';else{s.phase='steps';s.step=last}render();return}}
  else if(sc==='st4'){const prev={gut:'soil',micro:'gut',close:'micro'}[S.st4.phase];if(prev){S.st4.phase=prev;render();return}}
  else if(sc==='st5'){if(S.st5.phase==='plan'){S.st5.phase='pick';render();return}}
  S.st1.phase=S.st1.phase==='reward'?'board':S.st1.phase;go('map');
}
function finish1(){if(!S.done[1]){S.done[1]=true;S.seeds+=5;const el=document.querySelector('.pill.seeds');if(el)el.lastChild.textContent=S.seeds}}
function finish(n){if(!S.done[n]){S.done[n]=true;S.seeds+=5}S.rew=n;S.sel=null;S.screen='reward';S.note=null;render()}
