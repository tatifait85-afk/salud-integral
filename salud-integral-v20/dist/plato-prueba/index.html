<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Mi Plato Inteligente</title>
<link rel="manifest" id="manifestlink" href="manifest.webmanifest">
<meta name="theme-color" content="#DCE8D2">
<link rel="icon" type="image/png" sizes="48x48" href="img/favicon-app-v2-48.png">
<link rel="apple-touch-icon" sizes="180x180" href="img/icon-app-v2-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" id="appletitle" content="Mi Plato">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Jost:wght@400;500;600&display=swap">
<style>
/* Tokens tomados del sitio en vivo (saludintegral.site): el diseño existente manda. */
:root {
  --ivory: #F7F3E8; --cream: #FBF8F1; --forest: #173A1E; --olive: #5F7318; --olive-d: #4B5C12;
  --mint: #DCE8D2; --terra-d: #A9552F; --terra-bg: #F6E6DA; --ink: #3A2C22; --ink-soft: #5A4A3E;
  --leaf: #2F6B2A; --amber-t: #7A4A00; --line: rgba(23, 58, 30, .16);
  --r-lg: 24px; --r-md: 16px; --r-sm: 10px; --shadow: 0 10px 30px -14px rgba(23, 58, 30, .28);
  --serif: 'Fraunces', 'Iowan Old Style', Georgia, serif;
  --sans: 'Jost', 'Segoe UI', system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { overflow-x: clip; }
body {
  margin: 0; color: var(--ink); font-family: var(--sans); font-size: 17px; line-height: 1.5;
  background-color: var(--ivory);
  background-image:
    radial-gradient(900px 520px at 88% -4%, rgba(168, 192, 138, .5), transparent 62%),
    radial-gradient(800px 520px at -4% 42%, rgba(244, 214, 170, .4), transparent 62%),
    linear-gradient(180deg, #F8F4E8 0%, #EAF1D9 50%, #F4EFD8 100%);
  background-repeat: no-repeat; position: relative; overflow-x: clip;
  padding-block: 20px 190px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
h1, h2, h3 { font-family: var(--serif); font-weight: 600; color: var(--forest); margin: 0; text-wrap: balance; }
p { margin: 0; }
button, input, textarea { font: inherit; color: inherit; }
img { display: block; max-width: 100%; height: auto; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--forest); outline-offset: 3px; border-radius: 8px; }
[tabindex="-1"]:focus { outline: none; }

.decor { position: absolute; z-index: 0; pointer-events: none; background: no-repeat center / contain; }
.decor-tr { top: 4px; right: -36px; width: 300px; height: 200px; background-image: url(img/decor-hojas.webp); }
.decor-br { bottom: 4px; right: -44px; width: 320px; height: 214px; background-image: url(img/decor-olivo.webp); }
.decor-bl { bottom: 8px; left: -10px; width: 130px; height: 138px; background-image: url(img/decor-rama.webp); opacity: .85; }

.app { position: relative; z-index: 1; width: min(100%, 560px); margin: 0 auto; display: grid; gap: 14px; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.logo { display: inline-block; border-radius: 8px; padding-block: 5px; }
.logo img { height: 46px; width: auto; }
.langswitch { display: inline-flex; border: 1.5px solid var(--forest); border-radius: 999px; padding: 3px; background: var(--cream); }
.langswitch button { border: 0; background: transparent; cursor: pointer; border-radius: 999px; min-height: 40px; min-width: 52px; padding: 0 12px; font-weight: 500; color: var(--forest); }
.langswitch button[aria-pressed="true"] { background: var(--forest); color: var(--cream); }

.card {
  background: linear-gradient(180deg, #FCF9F2 0%, #F0F6E2 100%); border: 1.5px solid var(--line);
  border-radius: 32px; box-shadow: var(--shadow); padding: 20px 18px 14px; display: grid;
  grid-template-columns: minmax(0, 1fr); gap: 16px; min-width: 0;
}
#view { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; min-width: 0; }
h2.title { font-size: 28px; line-height: 1.15; }
.hero h2 { font-size: 34px; line-height: 1.1; }
.lead { margin-top: 8px; color: var(--ink-soft); font-size: 16px; }

/* Inicio */
.cta-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.cta { position: relative; display: grid; gap: 8px; justify-items: center; text-align: center; text-decoration: none; background: var(--cream); border-radius: var(--r-lg); box-shadow: var(--shadow); padding: 16px 12px 14px; min-width: 0; }
.cta img { width: 64px; height: 64px; border-radius: 14px; mix-blend-mode: multiply; }
.cta h3 { font-size: 19px; line-height: 1.15; font-weight: 500; }
.cta p { font-size: 14px; color: var(--ink-soft); line-height: 1.35; }
.go { display: inline-grid; place-items: center; width: 44px; height: 44px; border-radius: 999px; background: var(--olive); color: #fff; margin-top: 4px; }
.cta:hover .go, .cta:focus-visible .go { background: var(--olive-d); }
.cta.small { padding: 12px 8px; } .cta.small img { width: 52px; height: 52px; } .cta.small h3 { font-size: 16px; }
.cta-wide { grid-column: 1 / -1; }
.tag-soon { font-size: 12px; font-weight: 600; color: var(--ink); border-radius: 999px; padding: 0 9px; background: rgba(255,255,255,.88); border: 1px solid var(--line); }
.cta.c-peach { background: linear-gradient(160deg, #FFF1DF 0%, #F9D2A4 100%); } .cta.c-peach .go { background: var(--terra-d); }
.cta.c-lav { background: linear-gradient(160deg, #F3EEFB 0%, #D8CAEF 100%); }
.cta.c-mint { background: linear-gradient(160deg, #F2F8E7 0%, #CFE4B8 100%); }
.cta.c-gold { background: linear-gradient(160deg, #FFF7DA 0%, #F3DE9A 100%); }
.cta.c-rose { background: linear-gradient(160deg, #FDEEED 0%, #F5C9C6 100%); }
.cta.c-sky { background: linear-gradient(160deg, #ECF5FB 0%, #C5DDEE 100%); }
.cta[aria-disabled="true"] { cursor: default; }
.homelang { display: grid; gap: 6px; color: var(--ink-soft); font-size: 15px; }
.instalar { display: grid; gap: 8px; justify-items: center; text-align: center; margin: 18px 0 14px; }
.instalar .btn img { width: 26px; height: 26px; border-radius: 7px; }
.instalar .hint { max-width: 46ch; }

/* Progreso */
.steps { display: flex; justify-content: space-between; position: relative; margin: 0; padding: 0; list-style: none; }
.steps::before { content: ""; position: absolute; left: 12.5%; right: 12.5%; top: 13px; height: 2px; background: linear-gradient(90deg, var(--leaf), rgba(47,107,42,.25) 40%, var(--line)); }
.steps li { position: relative; display: grid; justify-items: center; gap: 4px; width: 25%; font-size: 11px; overflow-wrap: normal; hyphens: none; min-width: 0; color: var(--ink-soft); text-align: center; line-height: 1.15; }
.steps .n { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 999px; background: var(--ivory); border: 1.5px solid var(--forest); color: var(--forest); font-weight: 600; font-size: 13px; }
.steps li.done .n { background: var(--leaf); border-color: var(--leaf); color: var(--cream); }
.steps li.now .n { background: var(--olive); border-color: var(--olive); color: #fff; box-shadow: 0 0 0 4px var(--mint); }
.steps li.now { color: var(--forest); font-weight: 600; }
.qbar { height: 6px; border-radius: 999px; background: rgba(23,58,30,.12); overflow: hidden; }
.qbar > span { display: block; height: 100%; background: var(--leaf); border-radius: 999px; }
.stepcount { font-size: 14px; color: var(--ink-soft); }

/* Opciones */
.opts { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
.opt { position: relative; display: grid; grid-template-columns: 48px minmax(0, 1fr) 22px; align-items: center; gap: 8px; text-align: left; cursor: pointer; min-height: 64px; padding: 8px 14px 8px 10px; background: var(--cream); border: 1.5px solid var(--line); border-radius: var(--r-md); box-shadow: 0 6px 16px -12px rgba(23,58,30,.45); }
.opt.noimg { grid-template-columns: minmax(0, 1fr) 22px; padding-left: 14px; }
.opt .ic { display: block; width: 48px; height: 48px; border-radius: 12px; overflow: hidden; background: var(--tile); }
.opt .ic img { width: 48px; height: 48px; mix-blend-mode: multiply; }
.opt .lbl { font-weight: 500; font-size: 17px; line-height: 1.15; display: grid; gap: 2px; }
.opt .sub { font-size: 12.5px; font-weight: 500; color: var(--amber-t); }
.optw { display: grid; }
.optw .more, .optw .subx { display: none; }
@media (max-width: 600px) {
  .optw .opt .sub { display: none; }
  .optw .more { display: block; justify-self: start; background: none; border: 0; padding: 6px 14px 2px; font: inherit; font-size: 14px; color: var(--forest); text-decoration: underline; cursor: pointer; min-height: 32px; }
  .optw.open .subx { display: block; margin: 0; padding: 2px 14px 6px; font-size: 13.5px; color: var(--amber-t); }
}
.tick { width: 22px; height: 22px; border-radius: 6px; border: 1.5px solid var(--forest); display: grid; place-items: center; background: var(--cream); color: transparent; font-size: 13px; font-weight: 700; }
.opt.radio .tick { border-radius: 999px; }
.opt[aria-pressed="true"] { border: 2.5px solid var(--forest); background: var(--mint); padding: 6.5px 12.5px 6.5px 8.5px; }
.opt.noimg[aria-pressed="true"] { padding-left: 12.5px; }
.opt[aria-pressed="true"] .tick { background: var(--forest); color: var(--cream); }
.grp { margin-bottom: 18px; padding: 12px; display: grid; gap: 12px; border: 1.5px solid var(--line); border-radius: var(--r-md); }
.grp-h { display: grid; grid-template-columns: 48px minmax(0, 1fr); align-items: center; gap: 10px; }
.grp-h .ic { display: block; width: 48px; height: 48px; border-radius: 12px; overflow: hidden; background: var(--tile); }
.grp-h .ic img { width: 48px; height: 48px; mix-blend-mode: multiply; }
.grp-h .gt { font-weight: 600; font-size: 18px; line-height: 1.15; }
.t-peach { --tile: #F9D3A6; } .t-rose { --tile: #F5C3C0; } .t-gold { --tile: #F1DB8F; } .t-sage { --tile: #BFDDA6; } .t-sky { --tile: #BFD9EC; } .t-lav { --tile: #D3C3EE; }
.cuis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.cu { position: relative; display: grid; grid-template-rows: auto auto; text-align: left; cursor: pointer; padding: 0; overflow: hidden; background: var(--cream); border: 1.5px solid var(--line); border-radius: var(--r-md); box-shadow: 0 6px 16px -12px rgba(23,58,30,.45); min-width: 0; }
.cu img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; }
.cu .lbl { font-size: 15px; display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 8px 10px; font-weight: 500; line-height: 1.15; }
.cu[aria-pressed="true"] { border: 3px solid var(--forest); background: var(--mint); }
.cu[aria-pressed="true"] .tick { background: var(--forest); color: var(--cream); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-height: 44px; padding: 0 16px; border-radius: 999px; background: var(--cream); border: 1.5px solid var(--line); cursor: pointer; font-weight: 500; }
.chip[aria-pressed="true"] { background: var(--mint); border: 2.5px solid var(--forest); padding: 0 14.5px; }
.chip[aria-pressed="true"]::before { content: "✓ "; font-weight: 700; }
.field { display: grid; gap: 6px; }
.field label { font-weight: 500; font-size: 15px; color: var(--forest); }
.field input, .field textarea { width: 100%; min-height: 48px; padding: 10px 14px; background: #fff; border: 1.5px solid var(--forest); border-radius: var(--r-sm); }
.field textarea { min-height: 84px; resize: vertical; }
.addrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
.hint { font-size: 14.5px; color: var(--ink-soft); }
.shop-groups { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
.shop-g h4 { margin: 0 0 6px; font-family: var(--serif, inherit); font-size: 18px; color: var(--forest); }
.subq { font-family: var(--serif, inherit); font-size: 20px; margin: 22px 0 6px; }
.warn { font-size: 14.5px; color: var(--amber-t); background: #FFF4DC; border: 1.5px solid #C98A1B; border-radius: var(--r-sm); padding: 8px 12px; }
.need { font-size: 14.5px; color: var(--terra-d); font-weight: 500; }

.privacy { display: grid; grid-template-columns: 40px 1fr; gap: 10px; align-items: center; font-size: 13.5px; color: var(--ink-soft); line-height: 1.35; background: #E3EED6; border-radius: var(--r-md); padding: 10px 12px; }
.privacy img { width: 40px; height: 40px; border-radius: 10px; mix-blend-mode: multiply; }
.privacy a { color: var(--forest); font-weight: 500; }
.pimg { display: block; border-radius: 10px; }

.nav { position: sticky; bottom: 0; z-index: 3; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.6fr); gap: 10px; padding: 12px 14px; margin-inline: -14px; background: rgba(251, 248, 241, .97); border-top: 1.5px solid var(--line); border-radius: 22px 22px 0 0; box-shadow: 0 -10px 24px -14px rgba(23, 58, 30, .35); }
.nav .btn { white-space: nowrap; padding-inline: 12px; }
@media (max-width: 420px) { .nav { grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 8px; } }
.nav.stack { grid-template-columns: minmax(0, 1fr); } .nav.stack .btn-primary { order: -1; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 6px 16px; text-align: center; line-height: 1.2; border-radius: 999px; border: 1.7px solid transparent; font-weight: 500; font-size: 16.5px; cursor: pointer; text-decoration: none; }
.btn-primary { background: var(--olive); color: #fff; } .btn-primary:hover { background: var(--olive-d); }
.btn-primary[aria-disabled="true"] { background: #B9BFA6; color: #4a4f3a; cursor: not-allowed; }
.btn-ghost { background: #FCF9F2; border-color: var(--forest); color: var(--forest); }
.linkrow { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 4px 12px; font-size: 14.5px; }
.linkrow.skiptop { width: auto; margin: 4px 0 0; justify-content: flex-start; }
.textbtn { background: none; border: 0; padding: 8px 4px; min-height: 44px; color: var(--forest); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.confirm { display: grid; gap: 10px; background: var(--terra-bg); border: 1.5px solid var(--terra-d); border-radius: var(--r-md); padding: 14px; }
.confirm .row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.btn-danger { background: var(--terra-d); color: #fff; }
.mydata { display: grid; gap: 10px; background: var(--cream); border: 1.5px solid var(--line); border-radius: var(--r-md); padding: 14px; width: 100%; }
.mydata h3 { font-size: 17px; }
.mydata .row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.mydata .btn { min-height: 48px; font-size: 15px; padding-inline: 10px; }
.btn-del { background: #fff; color: var(--terra-d); border: 2px solid var(--terra-d); font-weight: 600; }
.perfiles { display: grid; gap: 8px; background: var(--cream); border: 1.5px solid var(--line); border-radius: var(--r-md); padding: 14px; }
.perfiles .field { margin: 0; }
.profilechip { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; background: var(--cream); border: 1.5px solid var(--line); border-radius: var(--r-md); padding: 10px 14px; }
.profilechip span { flex: 1 1 200px; min-width: 0; overflow-wrap: anywhere; }
.profilechip a { font-weight: 600; color: var(--forest); min-height: 44px; display: inline-flex; align-items: center; }
@media (max-width: 420px) { .mydata .row { grid-template-columns: minmax(0, 1fr); } }

/* Resumen */
.sum { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }
.sum li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; background: var(--cream); border: 1.5px solid var(--line); border-radius: var(--r-md); padding: 10px 14px; }
.sum .k { font-size: 13.5px; color: var(--ink-soft); font-weight: 500; }
.sum .v { font-weight: 500; overflow-wrap: anywhere; }
.sum li.grp { display: block; background: none; border: 0; padding: 6px 0 0; grid-column: 1 / -1; }
.sum li.grp .hint { margin-top: 4px; }
.sum .v.miss { color: var(--terra-d); }
.sum .txt { display: grid; gap: 1px; min-width: 0; }
.sum a { color: var(--forest); font-weight: 500; min-height: 44px; display: inline-flex; align-items: center; }
.toast { font-size: 14px; color: var(--amber-t); background: #FFF4DC; border-radius: var(--r-sm); padding: 6px 12px; }

@media (prefers-reduced-motion: no-preference) {
  .cta, .btn, .opt, .chip, .cu, .go { transition: background-color .15s ease, border-color .15s ease; }
}
@media (max-width: 420px) { .steps li { font-size: 10px; letter-spacing: -.1px; } .hero h2 { font-size: 30px; } h2.title { font-size: 25px; } .card { padding: 18px 14px 12px; } }
@media (max-width: 600px) {
  .decor-tr { display: none; } .decor-br { width: 200px; height: 134px; right: -40px; } .decor-bl { width: 90px; height: 96px; }
  body { padding-block-end: 150px; }
}

/* Resultados */
.notice { font-size: 14.5px; color: var(--amber-t); background: #FFF4DC; border: 1.5px solid #C98A1B; border-radius: var(--r-sm); padding: 10px 12px; }
.iab { margin-top: 12px; }
.iab:focus { outline: none; }

/* Ingredientes en casa: categorías, buscador y tarjetas con imagen */
.ing { display: grid; gap: 14px; min-width: 0; }
.ing-search { position: relative; }
.ing-search svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--forest); pointer-events: none; }
.ing-search input { width: 100%; min-height: 48px; padding: 10px 14px 10px 44px; background: #fff; border: 1.5px solid var(--forest); border-radius: 999px; font: inherit; }
.ing-main { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); min-width: 0; }
.ing-cats { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: thin; }
.ing-cat { flex: none; display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px; border-radius: 999px; background: var(--cream); border: 1.5px solid var(--line); cursor: pointer; font: inherit; font-weight: 500; color: var(--forest); white-space: nowrap; }
.ing-cat img { width: 26px; height: 26px; border-radius: 50%; object-fit: cover; }
.ing-cat[aria-pressed="true"] { background: var(--mint); border: 2.5px solid var(--forest); padding: 0 12.5px; }
.ing-cat .n { font-size: 13px; background: var(--forest); color: var(--cream); border-radius: 999px; min-width: 20px; height: 20px; display: inline-grid; place-items: center; padding: 0 6px; }
.ing-list { display: grid; gap: 14px; min-width: 0; }
.ing-sec { background: rgba(251, 248, 241, .85); border: 1.5px solid var(--line); border-radius: var(--r-md); padding: 12px; display: grid; gap: 10px; }
.ing-sec h3 { margin: 0; display: flex; align-items: center; gap: 10px; font-family: var(--serif); font-size: 20px; color: var(--forest); }
.ing-sec h3 img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; }
.ing-grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); }
.ing-card { position: relative; display: grid; grid-template-rows: auto auto; gap: 4px; justify-items: center; padding: 6px 6px 8px; background: var(--cream); border: 1.5px solid var(--line); border-radius: 14px; cursor: pointer; font: inherit; color: var(--forest); text-align: center; min-width: 0; }
.ing-card .im { width: 100%; aspect-ratio: 1 / 1; border-radius: 10px; overflow: hidden; background: var(--mint); display: grid; place-items: center; }
.ing-card .im img { width: 100%; height: 100%; object-fit: cover; }
.ing-card .nm { font-size: 14.5px; font-weight: 500; line-height: 1.2; overflow-wrap: anywhere; }
.ing-card .tick { position: absolute; top: 10px; right: 10px; width: 24px; height: 24px; border-radius: 50%; background: var(--forest); color: var(--cream); display: none; place-items: center; font-size: 14px; font-weight: 700; }
.ing-card[aria-pressed="true"] { border: 2.5px solid var(--forest); background: var(--mint); padding: 4.5px 4.5px 6.5px; }
.ing-card[aria-pressed="true"] .tick { display: grid; }
.ing-empty { margin: 0; padding: 14px; color: var(--ink-soft); }
.ing-sel { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
@media (max-width: 899px) { .ing-sel { position: sticky; top: 0; z-index: 5; background: var(--cream); padding: 8px 10px; margin: 8px 0; border: 1.5px solid var(--line); border-radius: var(--r-md); max-height: 112px; overflow-y: auto; box-shadow: 0 4px 10px rgba(0,0,0,.06); } }
.ing-sel .cnt { font-weight: 500; color: var(--forest); margin-right: 4px; }
.ing-chip { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 12px; border-radius: 999px; background: var(--mint); border: 1.5px solid var(--forest); font: inherit; font-size: 15px; cursor: pointer; color: var(--forest); }
@media (min-width: 900px) {
  .ing-main { grid-template-columns: 280px minmax(0, 1fr); align-items: start; }

    else if (act === "dieta") a.dieta = (a.dieta === id ? null : id);
    else if (act === "cond") toggleExcl(a.cond, id);
    else if (act === "alerg") toggleExcl(a.alerg, id);
    else if (act === "evita") {
      /* «Como de todo» excluye al resto (y borra el texto libre); elegir cualquier otro lo quita. */
      if (id === "todo") { if (has(a.evita, "todo")) a.evita = []; else { a.evita = ["todo"]; a.evitaOtra = ""; } }
      else { var td = a.evita.indexOf("todo"); if (td > -1) a.evita.splice(td, 1); toggleMulti(a.evita, id); }
    }
    else if (act === "cocina") toggleMulti(a.cocina, id);
    else if (act === "comida") a.comida = (a.comida === id ? null : id);
    else if (act === "tiempo") a.tiempo = (a.tiempo === +id ? null : +id);
    else if (act === "porc") a.porc = (a.porc === +id ? null : +id);
    else if (act === "ingr") toggleMulti(a.ingr, id);
    else return;
    save(); render(false);
    var again = document.querySelector('[data-act="' + act + '"][data-id="' + keepFocus + '"]'); if (again) again.focus({ preventScroll: true });
    var tx = (act === "cond" && id === "otra") || (act === "alerg" && id === "otra") || (act === "meds" && id === "si");
    if (tx) { var inp = $("#qbody input, #qbody textarea"); if (inp) inp.focus({ preventScroll: true }); }
  });
  function addIngredient() {
    var inp = $("#f-ingNew"); if (!inp) return;
    var v = inp.value.replace(/\s+/g, " ").trim(); if (!v) { inp.focus(); return; }
    var key = "c:" + v;
    if (!has(S.a.ingr, key)) S.a.ingr.push(key);
    save(); render(false); var n = $("#f-ingNew"); if (n) n.focus({ preventScroll: true });
  }
  document.addEventListener("input", function (e) {
    if (e.target.id === "f-ingQ") { ING_UI.q = e.target.value; var L2 = $("#ing-list"); if (L2) L2.innerHTML = ingListHtml(); return; }
    var k = e.target.getAttribute && e.target.getAttribute("data-text"); if (!k) return;
    if (k === "perfN") {
      S.perfiles[S.cur].n = e.target.value.slice(0, 24); save();
      var pv = $("#avprev"); if (pv) pv.innerHTML = avatarHtml(S.cur, 120);
      var ib = $("#avini"); if (ib) { var nm2 = S.perfiles[S.cur].n.trim(); ib.innerHTML = '<span class="av" style="width:76px;height:76px"><span class="ini" style="font-size:35px">' + esc(Array.from(perfNombre(S.cur))[0].toUpperCase()) + '</span></span>'; }
      chrome(); return;
    }
    S.a[k] = e.target.value;
    if (k === "evitaOtra" && e.target.value.trim() && has(S.a.evita, "todo")) { /* escribir un alimento a evitar quita «Como de todo» */
      S.a.evita.splice(S.a.evita.indexOf("todo"), 1);
      var ct = document.querySelector('[data-act="evita"][data-id="todo"]'); if (ct) ct.setAttribute("aria-pressed", "false");
    }
    save(); refreshStepState();
  });
  document.addEventListener("change", function (e) {
    if (e.target.id !== "f-foto") return;
    var f = e.target.files && e.target.files[0], say = function (t) { var m = $("#fotomsg"); if (m) m.textContent = t; };
    e.target.value = ""; if (!f) return;
    if (!/^image\//.test(f.type)) { say(tt("Elija un archivo de imagen (JPG, PNG o WebP).", "Choose an image file (JPG, PNG or WebP).")); return; }
    if (f.size > 10 * 1024 * 1024) { say(tt("La fotografía pesa más de 10 MB. Elija una más liviana.", "The photo is larger than 10 MB. Choose a smaller one.")); return; }
    var pf = S.perfiles[S.cur];
    fotoPrep(f, function (b) {
      if (!b) { say(tt("No se pudo leer la fotografía. Pruebe con otra.", "We could not read the photo. Try another one.")); return; }
      fotoPut(pf.id, b, function (ok) {
        if (!ok) { say(tt("Este navegador no permite guardar la fotografía en el dispositivo.", "This browser does not allow saving the photo on the device.")); return; }
        if (PHOTO[pf.id]) { try { URL.revokeObjectURL(PHOTO[pf.id]); } catch (e2) {} }
        PHOTO[pf.id] = URL.createObjectURL(b); pf.av = "foto"; save(); render(false);
        say(tt("Fotografía guardada en este dispositivo.", "Photo saved on this device."));
      });
    });
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && e.target.id === "f-ingNew") { e.preventDefault(); addIngredient(); }
  });
  window.addEventListener("hashchange", function () { confirming = false; render(true); });

  load();
  render(false);
  fotosLoad();
  if ("serviceWorker" in navigator) window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
})();
</script>
</body>
</html>
